<svg xmlns="http://www.w3.org/2000/svg" width="1490" height="1140" viewBox="0 0 1490 1140"
     role="img" aria-labelledby="title description">
  <title id="title">Chronomatron FSM state diagram</title>
  <desc id="description">The game starts at the seed menu, waits for cleared switches, counts down, shows
  eight colors with gaps, and collects eight inputs. Answer checking leads to level clear, wrong answer
  or game complete. Ambiguous inputs lead to a retry. Start in a result state returns to Prepare.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#526783"/>
    </marker>
    <style>
      text {font-family:"DejaVu Sans",sans-serif;fill:#14283e}
      .title {font-size:40px;font-weight:700}
      .subtitle {font-size:18px;fill:#455a73}
      .group {font-size:13px;font-weight:700;letter-spacing:1.8px;fill:#455a73}
      .card {stroke:#9db1ca;stroke-width:1.5;fill:#eff5ff}
      .watch {fill:#e9f8f6;stroke:#8abdb5}
      .check {fill:#f0edff;stroke:#b3a7d5}
      .pass {fill:#eaf7ed;stroke:#93ba9a}
      .stop {fill:#fff1ec;stroke:#d8a296}
      .retry {fill:#fff5de;stroke:#cbb476}
      .id {font-family:"DejaVu Sans Mono",monospace;font-size:19px;font-weight:700}
      .detail {font-size:15px;fill:#344e67}
      .action {font-size:14px;font-weight:700;fill:#254a6d}
      .link {fill:none;stroke:#526783;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
      .guard {font-size:14px;fill:#324e6c;stroke:#fff;stroke-width:5;stroke-linejoin:round;paint-order:stroke fill}
      .badge {fill:#28547c}
      .badgeText {font-family:"DejaVu Sans Mono",monospace;font-weight:700;font-size:16px;fill:#fff}
      .note {font-size:14.5px;fill:#344e67}
    </style>
  </defs>

  <rect width="1490" height="1140" fill="#fff"/>
  <text class="title" x="62" y="57">Chronomatron · FSM State Diagram</text>
  <text class="subtitle" x="64" y="86">8 seeds × 8 levels on Nexys A7-100T</text>
  <path d="M64 107H1426" stroke="#d7dfea" stroke-width="1.5"/>

  <text class="group" x="530" y="130">MAIN GAME STATES</text>
  <text class="group" x="72" y="522">SEQUENCE DISPLAY</text>
  <text class="group" x="72" y="794">AMBIGUOUS INPUT</text>
  <text class="group" x="1135" y="725">RESULT STATES</text>

  <g aria-label="Transitions">
    <!-- Down the main column. -->
    <path class="link" d="M705 218 V272"/>
    <path class="link" d="M705 348 V408"/>
    <path class="link" d="M705 484 V544"/>
    <path class="link" d="M705 620 V680"/>
    <path class="link" d="M705 756 V816"/>
    <path class="link" d="M705 892 V952"/>
    <!-- Color loop and ambiguous input. -->
    <path class="link" d="M530 568 H370"/>
    <path class="link" d="M370 605 H530"/>
    <path class="link" d="M530 854 H370"/>
    <!-- Branches out of CHECK. -->
    <path class="link" d="M880 970 H944 V784 H1135"/>
    <path class="link" d="M880 990 H985 V887 H1135"/>
    <path class="link" d="M880 1010 H1023 V990 H1135"/>
  </g>

  <g class="guard">
    <text x="721" y="250">Start · Lock seed · Level 1</text>
    <text x="721" y="382">SW0–SW7 all OFF</text>
    <text x="721" y="518">Final countdown tick</text>
    <text x="721" y="654">Timer done for color 8</text>
    <text x="721" y="790">SW0–SW7 all OFF</text>
    <text x="721" y="926">8 accepted colors</text>
    <text x="450" y="557" text-anchor="middle">Colors 1–7 done</text>
    <text x="450" y="628" text-anchor="middle">180 ms · Next color</text>
    <text x="450" y="826" text-anchor="middle">Two new colors</text>
    <text x="450" y="844" text-anchor="middle">in one clock cycle</text>
    <text x="1036" y="773" text-anchor="middle">Match · Levels 1–7</text>
    <text x="1057" y="876" text-anchor="middle">Mismatch</text>
    <text x="1080" y="954" text-anchor="middle">Match</text>
    <text x="1080" y="972" text-anchor="middle">Level 8</text>
  </g>

  <g transform="translate(530 142)">
    <rect class="card" width="350" height="76" rx="11"/>
    <text class="id" x="18" y="30">CM_MENU</text>
    <text class="detail" x="18" y="55">Select seed 0–7</text>
  </g>
  <g transform="translate(530 272)">
    <rect class="card" width="350" height="76" rx="11"/>
    <text class="id" x="18" y="30">CM_PREPARE</text>
    <text class="detail" x="18" y="55">Clear answer buffer and wait for switches</text>
    <rect class="badge" x="306" y="11" width="30" height="27" rx="6"/>
    <text class="badgeText" x="321" y="30" text-anchor="middle">A</text>
  </g>
  <g transform="translate(530 408)">
    <rect class="card watch" width="350" height="76" rx="11"/>
    <text class="id" x="18" y="30">CM_COUNTDOWN</text>
    <text class="detail" x="18" y="55">Count 3 → 2 → 1 at one-second intervals</text>
  </g>
  <g transform="translate(530 544)">
    <rect class="card watch" width="350" height="76" rx="11"/>
    <text class="id" x="18" y="30">CM_SHOW</text>
    <text class="detail" x="18" y="55">Show the current ROM color for this level</text>
  </g>
  <g transform="translate(72 544)">
    <rect class="card watch" width="298" height="76" rx="11"/>
    <text class="id" x="18" y="30">CM_GAP</text>
    <text class="detail" x="18" y="55">Hide the color for 180 ms</text>
  </g>
  <g transform="translate(530 680)">
    <rect class="card" width="350" height="76" rx="11"/>
    <text class="id" x="18" y="30">CM_ARM_INPUT</text>
    <text class="detail" x="18" y="55">Check the color switches again</text>
  </g>
  <g transform="translate(530 816)">
    <rect class="card" width="350" height="76" rx="11"/>
    <text class="id" x="18" y="30">CM_INPUT</text>
    <text class="detail" x="18" y="55">Record each new color in input order</text>
  </g>
  <g transform="translate(72 816)">
    <rect class="card retry" width="298" height="76" rx="11"/>
    <text class="id" x="18" y="27">CM_RETRY_INPUT</text>
    <text class="detail" x="18" y="48">Ask the player to replay</text>
    <text class="action" x="18" y="67">Start → A · Same level</text>
  </g>
  <g transform="translate(530 952)">
    <rect class="card check" width="350" height="76" rx="11"/>
    <text class="id" x="18" y="30">CM_CHECK</text>
    <text class="detail" x="18" y="55">Compare the answer buffer with ROM</text>
  </g>
  <g transform="translate(1135 746)">
    <rect class="card pass" width="291" height="76" rx="11"/>
    <text class="id" x="18" y="27">CM_LEVEL_CLEAR</text>
    <text class="detail" x="18" y="48">Show LEVEL CLEARED</text>
    <text class="action" x="18" y="67">Start → A · Next level</text>
  </g>
  <g transform="translate(1135 849)">
    <rect class="card stop" width="291" height="76" rx="11"/>
    <text class="id" x="18" y="27">CM_WRONG</text>
    <text class="detail" x="18" y="48">Show the first wrong position</text>
    <text class="action" x="18" y="67">Start → A · Level 1, same seed</text>
  </g>
  <g transform="translate(1135 952)">
    <rect class="card pass" width="291" height="76" rx="11"/>
    <text class="id" x="18" y="27">CM_COMPLETE</text>
    <text class="detail" x="18" y="48">Show GAME COMPLETED</text>
    <text class="action" x="18" y="67">Start → A · Level 1, same seed</text>
  </g>

  <path d="M64 1053H1426" stroke="#d7dfea" stroke-width="1.5"/>
  <text class="note" x="64" y="1080">
    <tspan font-weight="700">Powered on or reset</tspan>
    <tspan> → CM_MENU. Restart (BTNC / R) returns to CM_MENU from any state.</tspan>
  </text>
  <text class="note" x="64" y="1105">
    <tspan font-weight="700">Controls</tspan>
    <tspan> · Start = BTND / Enter. A = return to CM_PREPARE. The FSM holds until a transition condition is met.</tspan>
  </text>
</svg>
